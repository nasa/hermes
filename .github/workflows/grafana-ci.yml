name: Grafana CI

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'grafana-datasource-plugin/**'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master
      - main
    paths:
      - 'grafana-datasource-plugin/**'

permissions:
  contents: read

jobs:
  build:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    defaults:
      run:
        working-directory: ./grafana-datasource-plugin
    outputs:
      plugin-id: ${{ steps.metadata.outputs.plugin-id }}
      plugin-version: ${{ steps.metadata.outputs.plugin-version }}
      has-e2e: ${{ steps.check-for-e2e.outputs.has-e2e }}
      has-backend: ${{ steps.check-for-backend.outputs.has-backend }}
    env:
      GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./grafana-datasource-plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:ci
      - name: Build frontend
        run: npm run build

      - name: Check for backend
        id: check-for-backend
        run: |
          if [ -f "Magefile.go" ]
          then
            echo "has-backend=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Go environment
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: ./grafana-datasource-plugin/go.mod

      - name: Lint backend
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          working-directory: ./grafana-datasource-plugin

      - name: Build backend
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: magefile/mage-action@a662bd8c29d8106879588cfff83b2faf6e6f59db # v4.0.0
        with:
          version: latest
          args: buildAll
          workdir: ./grafana-datasource-plugin

      - name: Test backend
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: magefile/mage-action@a662bd8c29d8106879588cfff83b2faf6e6f59db # v4.0.0
        with:
          version: latest
          args: test
          workdir: ./grafana-datasource-plugin

      - name: Check for E2E
        id: check-for-e2e
        run: |
          if [ -f "playwright.config.ts" ]
          then
            echo "has-e2e=true" >> $GITHUB_OUTPUT
          fi

      - name: Sign plugin
        run: npm run sign
        if: ${{ env.GRAFANA_ACCESS_POLICY_TOKEN != '' }}

      - name: Get plugin metadata
        id: metadata
        run: |
          sudo apt-get install jq

          export GRAFANA_PLUGIN_ID=$(cat dist/plugin.json | jq -r .id)
          export GRAFANA_PLUGIN_VERSION=$(cat dist/plugin.json | jq -r .info.version)
          export GRAFANA_PLUGIN_ARTIFACT=${GRAFANA_PLUGIN_ID}-${GRAFANA_PLUGIN_VERSION}.zip

          echo "plugin-id=${GRAFANA_PLUGIN_ID}" >> $GITHUB_OUTPUT
          echo "plugin-version=${GRAFANA_PLUGIN_VERSION}" >> $GITHUB_OUTPUT
          echo "archive=${GRAFANA_PLUGIN_ARTIFACT}" >> $GITHUB_OUTPUT

      - name: Package plugin
        id: package-plugin
        run: |
          mv dist ${PLUGIN_ID}
          zip ${ARCHIVE} ${PLUGIN_ID} -r
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
          PLUGIN_ID: ${{ steps.metadata.outputs.plugin-id }}

      - name: Check plugin.json
        run: |
          docker run --pull=always \
            -v $PWD/${ARCHIVE}:/archive.zip \
            grafana/plugin-validator-cli -analyzer=metadatavalid /archive.zip
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}

      - name: Archive Build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.plugin-id }}-${{ steps.metadata.outputs.plugin-version }}
          path: grafana-datasource-plugin/${{ steps.metadata.outputs.plugin-id }}
          retention-days: 5

  resolve-versions:
    name: Resolve e2e images
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: build
    if: ${{ needs.build.outputs.has-e2e == 'true' }}
    outputs:
      matrix: ${{ steps.resolve-versions.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read grafanaDependency from plugin.json
        id: plugin-dep
        run: |
          DEP=$(jq -r '.dependencies.grafanaDependency' grafana-datasource-plugin/src/plugin.json)
          echo "grafana-dependency=${DEP}" >> "$GITHUB_OUTPUT"

      - name: Resolve Grafana E2E versions
        id: resolve-versions
        uses: grafana/plugin-actions/e2e-version@e2e-version/v3.0.2
        with:
          grafana-dependency: ${{ steps.plugin-dep.outputs.grafana-dependency }}

  playwright-tests:
    needs: [resolve-versions, build]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        GRAFANA_IMAGE: ${{fromJson(needs.resolve-versions.outputs.matrix)}}
    name: e2e test ${{ matrix.GRAFANA_IMAGE.name }}@${{ matrix.GRAFANA_IMAGE.VERSION }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./grafana-datasource-plugin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download plugin
        uses: actions/download-artifact@v8
        with:
          path: grafana-datasource-plugin/dist
          name: ${{ needs.build.outputs.plugin-id }}-${{ needs.build.outputs.plugin-version }}

      - name: Execute permissions on binary
        if: needs.build.outputs.has-backend == 'true'
        run: |
          chmod +x ./dist/gpx_*

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./grafana-datasource-plugin/package-lock.json

      - name: Install dev dependencies
        run: npm ci

      - name: Start Grafana
        run: |
          docker compose pull
          ANONYMOUS_AUTH_ENABLED=false DEVELOPMENT=false GRAFANA_VERSION=${{ matrix.GRAFANA_IMAGE.VERSION }} GRAFANA_IMAGE=${{ matrix.GRAFANA_IMAGE.NAME }} docker compose up -d

      - name: Wait for grafana server
        uses: grafana/plugin-actions/wait-for-grafana@wait-for-grafana/v1.0.5
        with:
          url: http://localhost:3000/login

      - name: Install Playwright Browsers
        run: npm exec playwright install chromium --with-deps

      - name: Run Playwright tests
        id: run-tests
        run: npm run e2e

      - name: Docker logs
        if: ${{ always() && steps.run-tests.outcome == 'failure' }}
        run: |
          docker logs nasa-hermes-datasource >& grafana-server.log

      - name: Stop grafana docker
        run: docker compose down

      # Uncomment this step to upload the server log to Github artifacts. Remember Github artifacts are public on the Internet if the repository is public.
      # - name: Upload server log
      #   uses: actions/upload-artifact@v4
      #   if: ${{ always() && steps.run-tests.outcome == 'failure' }}
      #   with:
      #     name: ${{ matrix.GRAFANA_IMAGE.NAME }}-v${{ matrix.GRAFANA_IMAGE.VERSION }}-${{github.run_id}}-server-log
      #     path: grafana-server.log
      #     retention-days: 5

  publish-dev:
    name: Publish dev build to GitHub Releases
    runs-on: ubuntu-latest
    needs: build
    if: >-
      ${{ github.event_name == 'pull_request' && github.event.action != 'closed'
          && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Compute build metadata
        id: meta
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          echo "pr-tag=grafana-plugin-pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Download built plugin
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.plugin-id }}-${{ needs.build.outputs.plugin-version }}
          path: ${{ needs.build.outputs.plugin-id }}

      - name: Package plugin
        id: package
        run: |
          ROLLING="${PLUGIN_ID}.zip"
          zip -r "${ROLLING}" "${PLUGIN_ID}"
          sha1sum "${ROLLING}" | cut -f1 -d' ' > "${ROLLING}.sha1"
          echo "rolling=${ROLLING}" >> "$GITHUB_OUTPUT"
          echo "rolling-sha1=${ROLLING}.sha1" >> "$GITHUB_OUTPUT"
        env:
          PLUGIN_ID: ${{ needs.build.outputs.plugin-id }}

      - name: Publish rolling PR release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.pr-tag }}
          name: "Grafana plugin (PR #${{ github.event.pull_request.number }})"
          prerelease: true
          body: |
            Development build of the Grafana datasource plugin for pull request #${{ github.event.pull_request.number }}.
            Commit: ${{ steps.meta.outputs.sha }}
          files: |
            ${{ steps.package.outputs.rolling }}
            ${{ steps.package.outputs.rolling-sha1 }}

      - name: Comment plugin build link on PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TAG: ${{ steps.meta.outputs.pr-tag }}
          SHA: ${{ steps.meta.outputs.sha }}
          PLUGIN_ID: ${{ needs.build.outputs.plugin-id }}
        run: |
          MARKER="<!-- grafana-plugin-build -->"
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${PR_TAG}"
          ZIP_URL="https://github.com/${REPO}/releases/download/${PR_TAG}/${PLUGIN_ID}.zip"
          SHORT_SHA="${SHA:0:7}"

          BODY=$(cat <<EOF
          ${MARKER}
          ### Grafana plugin dev build

          A development build of the Grafana datasource plugin is available for this PR (updated on every push).

          - **Release:** [${PR_TAG}](${RELEASE_URL})
          - **Download:** [\`${PLUGIN_ID}.zip\`](${ZIP_URL})
          - **Commit:** \`${SHORT_SHA}\`

          To try it, set \`GF_INSTALL_PLUGINS\` to \`${ZIP_URL};${PLUGIN_ID}\`.
          EOF
          )

          # Find an existing sticky comment (by marker) and update it, else create one.
          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "map(select(.body | contains(\"${MARKER}\"))) | .[0].id // empty")

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" -f body="$BODY" >/dev/null
            echo "Updated sticky comment $COMMENT_ID"
          else
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$BODY" >/dev/null
            echo "Created sticky comment"
          fi

  cleanup-pr-release:
    name: Delete per-PR dev release on close
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
    steps:
      - name: Delete PR release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TAG: grafana-plugin-pr-${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$PR_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release delete "$PR_TAG" --repo "$REPO" --cleanup-tag --yes
            echo "Deleted release and tag $PR_TAG"
          else
            echo "No release found for $PR_TAG; nothing to clean up."
          fi
