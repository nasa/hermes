apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: timescaledb
    type: postgres
    access: proxy
    url: timescaledb:5432
    user: postgres
    database: hermes
    secureJsonData:
      password: "password"
    jsonData:
      # Modern Grafana reads the database from jsonData; the deprecated
      # top-level key is kept for older releases.
      database: hermes
      sslmode: "disable"
      timescaledb: true
    isDefault: true
    editable: true
