services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hermes
    ports:
      - 5432:5432/tcp
    volumes:
      - timescale-data:/var/lib/postgresql/data
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # We load the Hermes datasource from the local build in grafana-datasource-plugin/dist (mounted below)
      # until a release ships it. To switch back, drop that mount and restore:
      # GF_INSTALL_PLUGINS: "https://github.com/nasa/hermes/releases/latest/download/nasa-hermes-datasource.zip;nasa-hermes-datasource"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: nasa-hermes-datasource
    depends_on:
      timescaledb:
        condition: service_started
      loki:
        condition: service_started
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config:/etc/grafana/provisioning:ro
      - ./grafana-datasource-plugin/dist:/var/lib/grafana/plugins/nasa-hermes-datasource:ro
  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./config/loki.yml:/etc/loki/local-config.yaml:ro
  otel-collector:
    image: otel/opentelemetry-collector:latest
    restart: unless-stopped
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      loki:
        condition: service_started
    volumes:
      - ./config/otel-collector.yml:/etc/otelcol/config.yaml:ro
volumes:
  timescale-data:
  grafana-data:
  loki-data:
